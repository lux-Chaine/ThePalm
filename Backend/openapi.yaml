openapi: 3.0.3
info:
  title: Palm API
  description: |
    RESTful API for Palm Application - Modular Monolith Architecture
    Implements CQRS pattern with clean separation between Identity and Sales modules.
  version: 1.0.0
  contact:
    name: Palm Development Team
    email: dev@palm.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.palm.com/v1
    description: Production server

tags:
  - name: Users
    description: User management operations (Identity Module)
  - name: Rooms
    description: Room management operations (Rooms Module)
  - name: Reservations
    description: Reservation management operations (Reservations Module)
  - name: Invoices
    description: Invoice management operations (Accounting Module)
  - name: Expenses
    description: Expense management operations (Accounting Module)

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a list of all users with optional pagination
      operationId: getAllUsers
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Users
      summary: Create a new user
      description: Create a new user with the provided information
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a specific user by their ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Users
      summary: Update user
      description: Update an existing user's information
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete a user by their ID
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/login:
    post:
      tags:
        - Users
      summary: User login
      description: Authenticate user and return token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      expires_at:
                        type: string
                        format: date-time
                        example: 2024-01-16 12:00:00
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/role:
    put:
      tags:
        - Users
      summary: Update user role
      description: Update user's role (admin, manager, user)
      operationId: updateUserRole
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [admin, manager, user]
                  example: manager
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/reset-password:
    put:
      tags:
        - Users
      summary: Reset user password
      description: Reset user's password (admin only)
      operationId: resetUserPassword
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  minLength: 8
                  format: password
                  example: newsecret123
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Password reset successfully
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/permissions:
    get:
      tags:
        - Users
      summary: Get user permissions
      description: Get the permissions assigned to a specific user
      operationId: getUserPermissions
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john.doe@example.com
                      role:
                        type: string
                        example: admin
                      user_type:
                        type: string
                        example: employee
                      permissions:
                        type: array
                        items:
                          type: string
                        example: ['users.manage', 'roles.manage', 'rooms.manage']
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles:
    get:
      tags:
        - Users
      summary: Get all roles
      description: Get all available roles with their permissions
      operationId: getAllRoles
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Administrator
                        description:
                          type: string
                          example: Full access to all system features
                        permissions:
                          type: array
                          items:
                            type: string
                          example: ['users.manage', 'roles.manage', 'rooms.manage']
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rooms:
    get:
      tags:
        - Rooms
      summary: Get all rooms
      description: Retrieve a list of all rooms with optional filtering
      operationId: getAllRooms
      parameters:
        - name: type
          in: query
          description: Filter by room type
          schema:
            type: string
            enum: [single, double, suite, deluxe, residential]
        - name: status
          in: query
          description: Filter by room status
          schema:
            type: string
            enum: [available, booked, cleaning, maintenance]
        - name: check_in
          in: query
          description: Check-in date for availability check
          schema:
            type: string
            format: date
        - name: check_out
          in: query
          description: Check-out date for availability check
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Rooms
      summary: Create a new room
      description: Create a new room with the provided information
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Room'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rooms/{id}:
    get:
      tags:
        - Rooms
      summary: Get room by ID
      description: Retrieve a specific room by their ID
      operationId: getRoomById
      parameters:
        - name: id
          in: path
          required: true
          description: Room ID
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Room'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Rooms
      summary: Update room
      description: Update an existing room's information
      operationId: updateRoom
      parameters:
        - name: id
          in: path
          required: true
          description: Room ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Room updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Room'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations:
    get:
      tags:
        - Reservations
      summary: Get all reservations
      description: Retrieve a list of all reservations with optional filtering
      operationId: getAllReservations
      parameters:
        - name: guest_id
          in: query
          description: Filter by guest ID
          schema:
            type: integer
        - name: room_id
          in: query
          description: Filter by room ID
          schema:
            type: integer
        - name: user_id
          in: query
          description: Filter by user ID
          schema:
            type: integer
        - name: status
          in: query
          description: Filter by reservation status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled]
        - name: start_date
          in: query
          description: Start date for date range filter
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: End date for date range filter
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Reservations
      summary: Create a new reservation
      description: Create a new reservation with the provided information
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{id}:
    get:
      tags:
        - Reservations
      summary: Get reservation by ID
      description: Retrieve a specific reservation by their ID
      operationId: getReservationById
      parameters:
        - name: id
          in: path
          required: true
          description: Reservation ID
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Reservation'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{id}/status:
    put:
      tags:
        - Reservations
      summary: Update reservation status
      description: Update the status of an existing reservation
      operationId: updateReservationStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Reservation ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, checked_in, checked_out, cancelled]
                  description: New reservation status
                cancellation_reason:
                  type: string
                  description: Reason for cancellation (if status is cancelled)
              required:
                - status
      responses:
        '200':
          description: Reservation status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invoices:
    get:
      tags:
        - Invoices
      summary: Get all invoices
      description: Retrieve a list of all invoices with optional filtering
      operationId: getAllInvoices
      parameters:
        - name: reservation_id
          in: query
          description: Filter by reservation ID
          schema:
            type: integer
        - name: status
          in: query
          description: Filter by payment status
          schema:
            type: string
            enum: [unpaid, partial, paid, overdue]
        - name: start_date
          in: query
          description: Start date for due date filter
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: End date for due date filter
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Invoices
      summary: Create a new invoice
      description: Create a new invoice with the provided information
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Invoice created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Invoice'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Get invoice by ID
      description: Retrieve a specific invoice by their ID
      operationId: getInvoiceById
      parameters:
        - name: id
          in: path
          required: true
          description: Invoice ID
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Invoice'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invoices/{id}/payment:
    put:
      tags:
        - Invoices
      summary: Update invoice payment
      description: Update the payment status and amount of an existing invoice
      operationId: updateInvoicePayment
      parameters:
        - name: id
          in: path
          required: true
          description: Invoice ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_status:
                  type: string
                  enum: [unpaid, partial, paid, overdue]
                  description: New payment status
                payment_amount:
                  type: number
                  format: decimal
                  description: Payment amount to add
                payment_method:
                  type: string
                  enum: [cash, credit_card, debit_card, bank_transfer]
                  description: Payment method
              required:
                - payment_status
      responses:
        '200':
          description: Invoice payment updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Invoice'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expenses:
    get:
      tags:
        - Expenses
      summary: Get all expenses
      description: Retrieve a list of all expenses with optional filtering
      operationId: getAllExpenses
      parameters:
        - name: category
          in: query
          description: Filter by expense category
          schema:
            type: string
            enum: [salaries, utilities, insurance, maintenance, supplies, cleaning, food_beverage, marketing, laundry, other]
        - name: status
          in: query
          description: Filter by expense status
          schema:
            type: string
            enum: [pending, approved, rejected, paid]
        - name: start_date
          in: query
          description: Start date for expense date filter
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: End date for expense date filter
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expense'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Expenses
      summary: Create a new expense
      description: Create a new expense with the provided information
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Expense'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expenses/{id}:
    get:
      tags:
        - Expenses
      summary: Get expense by ID
      description: Retrieve a specific expense by their ID
      operationId: getExpenseById
      parameters:
        - name: id
          in: path
          required: true
          description: Expense ID
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Expense'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expenses/{id}/status:
    put:
      tags:
        - Expenses
      summary: Update expense status
      description: Update the status of an existing expense
      operationId: updateExpenseStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Expense ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, approved, rejected, paid]
                  description: New expense status
                rejection_reason:
                  type: string
                  description: Reason for rejection (if status is rejected)
              required:
                - status
      responses:
        '200':
          description: Expense status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Expense'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          enum: [admin, manager, receptionist, housekeeping, maintenance, accountant]
          example: receptionist
        user_type:
          type: string
          enum: [employee]
          example: employee
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: secret123
        role:
          type: string
          enum: [admin, manager, receptionist, housekeeping, maintenance, accountant]
          default: receptionist
          example: receptionist
        user_type:
          type: string
          enum: [employee]
          default: employee
          example: employee

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: newsecret123
        role:
          type: string
          enum: [admin, manager, receptionist, housekeeping, maintenance, accountant]
          example: manager
        user_type:
          type: string
          enum: [employee]
          example: employee

    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        room_number:
          type: string
          example: 101
        type:
          type: string
          enum: [single, double, suite, deluxe, residential]
          example: suite
        price_per_night:
          type: number
          format: decimal
          example: 299.99
        status:
          type: string
          enum: [available, booked, cleaning, maintenance]
          example: available
        floor:
          type: integer
          example: 1
        capacity:
          type: integer
          example: 2
        description:
          type: string
          nullable: true
          example: Luxury suite with ocean view
        amenities:
          type: array
          items:
            type: string
          nullable: true
          example: ["wifi", "tv", "minibar"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoomRequest:
      type: object
      required:
        - room_number
        - type
        - price_per_night
      properties:
        room_number:
          type: string
          example: 101
        type:
          type: string
          enum: [single, double, suite, deluxe, residential]
          example: suite
        price_per_night:
          type: number
          format: decimal
          minimum: 0
          example: 299.99
        floor:
          type: integer
          minimum: 1
          example: 1
        capacity:
          type: integer
          minimum: 1
          example: 2
        description:
          type: string
          nullable: true
          example: Luxury suite with ocean view
        amenities:
          type: array
          items:
            type: string
          nullable: true
          example: ["wifi", "tv", "minibar"]

    UpdateRoomRequest:
      type: object
      properties:
        room_number:
          type: string
          example: 101
        type:
          type: string
          enum: [single, double, suite, deluxe, residential]
          example: suite
        price_per_night:
          type: number
          format: decimal
          minimum: 0
          example: 299.99
        status:
          type: string
          enum: [available, booked, cleaning, maintenance]
          example: available
        floor:
          type: integer
          minimum: 1
          example: 1
        capacity:
          type: integer
          minimum: 1
          example: 2
        description:
          type: string
          nullable: true
          example: Luxury suite with ocean view
        amenities:
          type: array
          items:
            type: string
          nullable: true
          example: ["wifi", "tv", "minibar"]

    Reservation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        guest_id:
          type: integer
          example: 1
        room_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        check_in:
          type: string
          format: date
          example: 2024-01-15
        check_out:
          type: string
          format: date
          example: 2024-01-18
        number_of_guests:
          type: integer
          example: 2
        total_amount:
          type: number
          format: decimal
          example: 899.97
        status:
          type: string
          enum: [pending, confirmed, checked_in, checked_out, cancelled]
          example: confirmed
        special_requests:
          type: string
          nullable: true
          example: Late check-in requested
        cancellation_reason:
          type: string
          nullable: true
          example: Change of plans
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateReservationRequest:
      type: object
      required:
        - guest_id
        - room_id
        - user_id
        - check_in
        - check_out
      properties:
        guest_id:
          type: integer
          example: 1
        room_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        check_in:
          type: string
          format: date
          example: 2024-01-15
        check_out:
          type: string
          format: date
          example: 2024-01-18
        number_of_guests:
          type: integer
          minimum: 1
          example: 2
        special_requests:
          type: string
          nullable: true
          example: Late check-in requested

    Invoice:
      type: object
      properties:
        id:
          type: integer
          example: 1
        invoice_number:
          type: string
          example: INV-2024-001
        reservation_id:
          type: integer
          example: 1
        created_by:
          type: integer
          example: 1
        amount:
          type: number
          format: decimal
          example: 899.97
        paid_amount:
          type: number
          format: decimal
          example: 0
        discount_amount:
          type: number
          format: decimal
          nullable: true
          example: 0
        tax_amount:
          type: number
          format: decimal
          nullable: true
          example: 0
        payment_status:
          type: string
          enum: [unpaid, partial, paid, overdue]
          example: unpaid
        payment_method:
          type: string
          enum: [cash, credit_card, debit_card, bank_transfer]
          nullable: true
          example: credit_card
        due_date:
          type: string
          format: date
          example: 2024-01-20
        invoice_date:
          type: string
          format: date
          example: 2024-01-15
        notes:
          type: string
          nullable: true
          example: Payment due within 5 days
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateInvoiceRequest:
      type: object
      required:
        - reservation_id
        - created_by
        - amount
        - due_date
      properties:
        reservation_id:
          type: integer
          example: 1
        created_by:
          type: integer
          example: 1
        amount:
          type: number
          format: decimal
          minimum: 0
          example: 899.97
        due_date:
          type: string
          format: date
          example: 2024-01-20
        discount_amount:
          type: number
          format: decimal
          nullable: true
          example: 0
        tax_amount:
          type: number
          format: decimal
          nullable: true
          example: 0
        payment_method:
          type: string
          enum: [cash, credit_card, debit_card, bank_transfer]
          nullable: true
          example: credit_card
        notes:
          type: string
          nullable: true
          example: Payment due within 5 days

    Expense:
      type: object
      properties:
        id:
          type: integer
          example: 1
        created_by:
          type: integer
          example: 1
        category:
          type: string
          enum: [salaries, utilities, insurance, maintenance, supplies, cleaning, food_beverage, marketing, laundry, other]
          example: maintenance
        description:
          type: string
          example: Room 101 AC repair
        amount:
          type: number
          format: decimal
          example: 150.00
        expense_date:
          type: string
          format: date
          example: 2024-01-15
        receipt_url:
          type: string
          format: uri
          nullable: true
          example: https://example.com/receipt.pdf
        status:
          type: string
          enum: [pending, approved, rejected, paid]
          example: approved
        rejection_reason:
          type: string
          nullable: true
          example: Duplicate expense
        notes:
          type: string
          nullable: true
          example: Emergency repair
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateExpenseRequest:
      type: object
      required:
        - created_by
        - category
        - description
        - amount
        - expense_date
      properties:
        created_by:
          type: integer
          example: 1
        category:
          type: string
          enum: [salaries, utilities, insurance, maintenance, supplies, cleaning, food_beverage, marketing, laundry, other]
          example: maintenance
        description:
          type: string
          example: Room 101 AC repair
        amount:
          type: number
          format: decimal
          minimum: 0
          example: 150.00
        expense_date:
          type: string
          format: date
          example: 2024-01-15
        receipt_url:
          type: string
          format: uri
          nullable: true
          example: https://example.com/receipt.pdf
        notes:
          type: string
          nullable: true
          example: Emergency repair

    Error:
      type: object
      properties:
        error:
          type: string
          example: Resource not found
        message:
          type: string
          example: The requested resource could not be found

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        message:
          type: string
          example: The given data was invalid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required
            password:
              - The password must be at least 8 characters

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token

security:
  - bearerAuth: []
